name: Repair release asset labels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-release-labels.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'dzq84'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clear labels and verify asset integrity
        shell: python
        run: |
          import json, subprocess
          def api(path, *args):
              return json.loads(subprocess.check_output(['gh', 'api', path, *args], text=True))
          repo = 'repos/stepaudiollm/hmu-bench'
          expected = {
              'HMUBench-2026-10-08-final-public.zip': 'sha256:aaf1bc0903a23e7e6a400be18df35de042b1f6ff254377de5b58c3da04b7d0ca',
              'HMUBench-2026-10-08-minimal.zip': 'sha256:597f762d95d1e78eeca6337435fc5e756b469222cfdcc45f225a03be4aafc0fc',
          }
          release = api(repo + '/releases/tags/v2026.10.08-data-final')
          assets = [a for a in release['assets'] if a['name'] in expected]
          assert len(assets) == 2
          for asset in assets:
              assert asset['digest'] == expected[asset['name']]
          for asset in assets:
              path = repo + '/releases/assets/' + str(asset['id'])
              updated = api(path, '--method', 'PATCH', '-f', 'label=')
              assert not updated.get('label')
              for key in ['id', 'name', 'size', 'digest', 'browser_download_url']:
                  assert updated[key] == asset[key], key
              verified = api(path)
              assert not verified.get('label')
              print(json.dumps({k: verified[k] for k in ['name', 'label', 'size', 'digest']}, indent=2))
